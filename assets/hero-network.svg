<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" width="760" height="1000">
<style>
.base{fill:none;stroke:#a7ded1;stroke-opacity:.46;stroke-width:1.3}
.pulse{fill:none;stroke:#e9fbf4;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:7 93;stroke-dashoffset:100;animation:flow 3.6s cubic-bezier(.45,0,.55,1) infinite}
.node{fill:#cfeee3}
.ring{fill:none;stroke:#a7ded1;stroke-opacity:.5;stroke-width:1}
.hub{fill:#fff}
.ripple{fill:none;stroke:#e9fbf4;stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:ripple 3.6s cubic-bezier(.23,1,.32,1) infinite}
.tw{fill:#e9fbf4;animation:tw 4.8s ease-in-out infinite}
.lab{font:700 11px Arial,Helvetica,sans-serif;letter-spacing:1.8px;fill:#e3f4ee;fill-opacity:.78;paint-order:stroke;stroke:#113c3e;stroke-width:4px;stroke-linejoin:round}
.main{font-size:14px;letter-spacing:2.4px;fill:#fff;fill-opacity:.95}
@keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes ripple{from{transform:scale(1);opacity:.75}to{transform:scale(7);opacity:0}}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.85}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pulse{display:none}.tw{opacity:.5}.ripple{opacity:0}}
</style>
